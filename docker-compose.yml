services:
  dnevnik-bot:
    build: .
    container_name: dnevnik-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Yekaterinburg
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
